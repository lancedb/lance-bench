[package]
name = "train-fts-index-benchmark"
version = "0.1.0"
edition = "2021"

[dependencies]
lance = { git = "https://github.com/lance-format/lance", rev = "70cd939bf50236a1d8529af3063724e4b879710a" }
lance-index = { git = "https://github.com/lance-format/lance", rev = "70cd939bf50236a1d8529af3063724e4b879710a" }
time = "=0.3.47"
tokio = { version = "1.0", features = ["full"] }
arrow-array = "59.2.0"
arrow-schema = "59.2.0"
parquet = { version = "59.2.0", features = ["arrow"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
futures = "0.3"
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
async-trait = "0.1"
anyhow = "1.0"
indicatif = "0.17"
jemallocator = "0.5"
libc = "0.2"
env_logger = "0.11"
tokio-metrics = "0.4"
tracing = "0.1"
tracing-chrome = "0.7"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Match Lance's workspace patch; Cargo does not inherit patches from git dependencies.
[patch.crates-io]
object_store = { git = "https://github.com/apache/arrow-rs-object-store.git", rev = "c10758c207c0103355f940f0c736fb8ecb157b04" }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
